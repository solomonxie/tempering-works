# Deployed by provision/scripts/10-sysctl.sh. Sysctl tuning for a high-concurrency epoll
# TCP/HTTP server. tcp_tw_recycle is deliberately omitted — removed in kernel 4.12+.

# file descriptors
fs.file-max = 2097152

# connection backlog / accept queue
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_syncookies = 1

# ephemeral ports / TIME_WAIT reuse
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
