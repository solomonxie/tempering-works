---
app_user: temperingworks
app_group: temperingworks
app_install_dir: /opt/temperingworks
app_bin_dir: "{{ app_install_dir }}/bin"
app_static_dir: "{{ app_install_dir }}/static"
app_log_dir: "{{ app_install_dir }}/logs"

app_http_port: 8080
# Flip to true (and app_http_port: 80) once ready — grants cap_net_bind_service on the
# binary via setcap instead of running the service as root.
app_bind_privileged_port: false

app_binary_name: temperingworks-server
# Local paths (on the Ansible control machine) to sync onto the box. Left unset by
# default since neither exists yet this early in the project — set via -e or host_vars
# once a build produces them.
app_binary_local_path: ""
frontend_dist_local_dir: ""

service_name: temperingworks-server
