---
- name: Update apk cache and upgrade packages
  community.general.apk:
    update_cache: true
    upgrade: true

- name: Install base packages
  community.general.apk:
    name:
      - curl
      - vim
      - htop
      - tzdata
    state: present

- name: Set timezone to UTC
  ansible.builtin.file:
    src: /usr/share/zoneinfo/UTC
    dest: /etc/localtime
    state: link
    force: true

- name: Create app group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true

- name: Create app user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false

# t4g.small has 2GB RAM; on-box `make -j$(nproc)` C++ builds can spike memory, and
# Alpine provisions no swap by default.
- name: Check for existing swapfile
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Create swapfile
  ansible.builtin.command:
    cmd: dd if=/dev/zero of=/swapfile bs=1M count=1024
  when: not swapfile_stat.stat.exists

- name: Set swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"
  when: not swapfile_stat.stat.exists

- name: Format swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not swapfile_stat.stat.exists

- name: Enable swapfile
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: not swapfile_stat.stat.exists

- name: Persist swapfile in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    create: true

# See files/sshd_config.orig for the shipped default this replaces (captured once, out
# of band, before this task was ever run against a live box — see ansible/README.md).
# Safe to disable password auth: tiny-cloud already injects the SSH key this play
# connects with, so key-based access isn't touched by this change.
- name: Harden sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Flush handlers so sshd restarts before later roles run
  ansible.builtin.meta: flush_handlers
