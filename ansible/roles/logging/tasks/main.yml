---
# Alpine ships neither logrotate nor a cron daemon by default; without dcron running,
# logrotate.d entries never get invoked.
- name: Install logrotate and dcron
  community.general.apk:
    name:
      - logrotate
      - dcron
    state: present

- name: Enable and start dcron
  ansible.builtin.service:
    name: dcron
    state: started
    enabled: true

- name: Deploy logrotate config for the app service
  ansible.builtin.template:
    src: temperingworks-server.logrotate.j2
    dest: /etc/logrotate.d/temperingworks-server
    owner: root
    group: root
    mode: "0644"
