---
- name: Create app directory layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_install_dir }}"
    - "{{ app_bin_dir }}"
    - "{{ app_static_dir }}"
    - "{{ app_log_dir }}"

- name: Deploy OpenRC init script
  ansible.builtin.template:
    src: temperingworks-server.initd.j2
    dest: "/etc/init.d/{{ service_name }}"
    owner: root
    group: root
    mode: "0755"

- name: Deploy OpenRC conf.d file
  ansible.builtin.template:
    src: temperingworks-server.confd.j2
    dest: "/etc/conf.d/{{ service_name }}"
    owner: root
    group: root
    mode: "0644"

# rsync backs the synchronize tasks below.
- name: Install rsync
  community.general.apk:
    name: rsync
    state: present

- name: Check for local pre-built binary
  ansible.builtin.stat:
    path: "{{ app_binary_local_path }}"
  register: local_binary_stat
  delegate_to: localhost
  become: false
  when: app_binary_local_path | length > 0

- name: Sync app binary to server
  ansible.builtin.copy:
    src: "{{ app_binary_local_path }}"
    dest: "{{ app_bin_dir }}/{{ app_binary_name }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  when: app_binary_local_path | length > 0 and local_binary_stat.stat.exists

- name: Check for local frontend build output
  ansible.builtin.stat:
    path: "{{ frontend_dist_local_dir }}"
  register: local_dist_stat
  delegate_to: localhost
  become: false
  when: frontend_dist_local_dir | length > 0

- name: Sync frontend static assets to server
  ansible.posix.synchronize:
    src: "{{ frontend_dist_local_dir }}/"
    dest: "{{ app_static_dir }}/"
    delete: true
  when: frontend_dist_local_dir | length > 0 and local_dist_stat.stat.exists

- name: Check for deployed binary
  ansible.builtin.stat:
    path: "{{ app_bin_dir }}/{{ app_binary_name }}"
  register: remote_binary_stat

- name: Grant cap_net_bind_service on the binary
  community.general.capabilities:
    path: "{{ app_bin_dir }}/{{ app_binary_name }}"
    capability: cap_net_bind_service+ep
    state: present
  when: app_bind_privileged_port and remote_binary_stat.stat.exists

- name: Enable app service at boot
  ansible.builtin.service:
    name: "{{ service_name }}"
    enabled: true

# Left stopped (not failed) until a real binary is synced above.
- name: Start app service
  ansible.builtin.service:
    name: "{{ service_name }}"
    state: started
  when: remote_binary_stat.stat.exists
